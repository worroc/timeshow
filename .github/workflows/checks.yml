name: Check and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 libglib2.0-bin gsettings-desktop-schemas gnome-keyring dbus
      - run: python -m pip install uv
      - run: uv sync --extra gui --group build
      - run: uv run python -m unittest discover -s tests -v
      - name: Validate Linux settings and system credentials
        if: runner.os == 'Linux'
        timeout-minutes: 2
        env:
          TIMESHOW_TEST_SYSTEMD_VERIFY: '1'
          TIMESHOW_TEST_SECRET_SERVICE: '1'
        run: dbus-run-session -- uv run python -m unittest discover -s tests -p test_linux_integration.py -v
      - name: Measure process footprint
        run: uv run python src/measure_footprint.py --output footprint.json
      - run: uv run python src/build_bundle.py
      - name: Smoke-test packaged worker
        env:
          TIMESHOW_TEST_BUNDLE: ${{ github.workspace }}/dist/Timeshow/Timeshow${{ runner.os == 'Windows' && '.exe' || '' }}
        run: uv run python -m unittest discover -s tests -p test_bundle_integration.py -v
      - name: Build Debian package
        if: runner.os == 'Linux'
        run: uv run python src/build_deb.py --bundle dist/Timeshow
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: uv run python src/build_windows_installer.py --bundle dist/Timeshow
      - name: Test Windows install and uninstall
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:TIMESHOW_TEST_INSTALLER = (Get-ChildItem dist/Timeshow-*-Setup.exe).FullName
          uv run python -m unittest discover -s tests -p test_windows_installer.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Check Debian package and extracted worker
        if: runner.os == 'Linux'
        run: |
          dpkg-deb --field dist/*.deb Package Version Architecture
          dpkg-deb --extract dist/*.deb "$RUNNER_TEMP/timeshow-deb"
          TIMESHOW_TEST_BUNDLE="$RUNNER_TEMP/timeshow-deb/opt/timeshow/Timeshow" \
            uv run python -m unittest discover -s tests -p test_bundle_integration.py -v
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: Timeshow-deb
          path: dist/*.deb
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Timeshow-Windows-installer
          path: |
            dist/Timeshow-*-Setup.exe
            dist/SHA256SUMS-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Timeshow-${{ runner.os }}
          path: dist/Timeshow/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: Footprint-${{ runner.os }}
          path: footprint.json
          if-no-files-found: error
